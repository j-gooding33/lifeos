name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      # `live`-tagged tests hit a real external API (only Open Library,
      # M8 — no key needed, but a real network dependency); excluded here
      # so CI never depends on a live third-party service being up.
      - run: flutter test --exclude-tags=live

  android-build:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-dev
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
