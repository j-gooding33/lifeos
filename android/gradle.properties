org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler computes relative paths between the Gradle
# project (this repo) and the Flutter/pub caches it compiles plugins from;
# on Windows that fails outright when the two live on different drive
# letters ("this and base files have different roots"), so every Kotlin
# plugin's compileDebugKotlin task throws while closing its incremental
# cache. Disabling incremental compilation avoids the crash — the plugins
# themselves are small and rarely change, so full recompiles cost little.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
