name: life_os
description: "Life OS: tasks, plans, habits, goals and library in one place."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  cached_network_image: ^3.4.1
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  drift: ^2.23.0

  file_picker: 8.1.7
  flutter:
    sdk: flutter

  flutter_cache_manager: ^3.4.2
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^9.2.4
  go_router: ^17.2.0
  http: ^1.2.2
  meta: ^1.15.0
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.5
  riverpod_annotation: ^3.0.0
  sentry_flutter: ^9.0.0
  share_plus: ^12.0.2
  sqlite3_flutter_libs: ^0.5.28
  supabase_flutter: ^2.9.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.23.0

  flutter_test:
    sdk: flutter

  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^3.0.0
  test: ^1.25.0
  very_good_analysis: ^7.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # §2.3 / theme schemes: all faces are SIL OFL, bundled locally — no
  # runtime Google Fonts fetch. Each is a single variable-font file
  # registered once per weight actually used; IBM Plex Mono and Bebas Neue
  # ship as static weight files upstream. InstrumentSans/Inter/IBMPlexMono
  # are the original M2 trio (still used by the Ledger/After Hours/Signal
  # mono role and, for Inter, After Hours' body); the rest were added for
  # the other three theme schemes — see DECISIONS.md.
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 600
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 600
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 600
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 600
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
          weight: 400
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-Variable.ttf
          weight: 600
