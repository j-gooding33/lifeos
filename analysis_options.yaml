# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # drift_dev schema-snapshot output (`schema dump` / `schema generate`)
    # — vendored, regenerated whenever schemaVersion bumps, never hand-edited.
    - "test/**/generated_migrations/**"

linter:
  rules:
    # This is an app, not a published package — forcing a doc comment on
    # every public class/method adds noise without a consumer to serve.
    # See DECISIONS.md.
    public_member_api_docs: false
    # Flutter's declarative, named-parameter widget syntax routinely runs
    # past 80 columns even when well-formatted; the rule has no
    # configurable threshold, only on/off. See DECISIONS.md.
    lines_longer_than_80_chars: false
